<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Super-administration — JungleRenov</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="_ds/junglerenov-design-system-fc00822c-9a4f-4aa5-96e5-e2f9567f58f8/styles.css">
  <link rel="stylesheet" href="lib/css/super-admin.css">
  <script src="_ds/junglerenov-design-system-fc00822c-9a4f-4aa5-96e5-e2f9567f58f8/_ds_bundle.js"></script>
  <script src="lib/_jr_legacy.js"></script>
  <link rel="icon" type="image/svg+xml" href="assets/favicon-couleur-32.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-couleur-180.svg">
</helmet>
<div style="background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;">
  <dc-import name="site-header" mode="admin" hint-size="100%,72px"></dc-import>
  <sc-if value="{{ small }}" hint-placeholder-val="{{ false }}">
    <div style="padding: var(--jr-s-6, 32px) 20px; max-width: 640px;"><x-import component-from-global-scope="JungleRenovDesignSystem_fc0082.Notice" tone="info" picto="information" title="L’administration se consulte sur un écran large" hint-size="100%,96px">Ouvrez cette page sur un écran d’au moins 1024 px de large pour accéder aux tableaux.</x-import></div>
  </sc-if>
  <div class="jr-legacy" id="jr-legacy-root" data-hide="{{ small }}" data-screen-label="Super-administration" style="flex: 1; display: {{ rootDisp }};"></div>
  <dc-import name="site-footer" compact="{{ true }}" hint-size="100%,200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: window.innerWidth };
  renderVals() { const s = this.state.w < 1024; return { small: s, rootDisp: s ? 'none' : 'block' }; }
  componentDidMount() {
    window.addEventListener('resize', () => this.setState({ w: window.innerWidth }));
    const name = 'super-admin';
    const go = () => {
      if (!window.jrBoot) return setTimeout(go, 40);
      fetch('pages/' + name + '/scripts.json').then(r => r.json()).then(m => {
        const root = document.getElementById('jr-legacy-root');
        (m.rootClass || '').split(/\s+/).filter(Boolean).forEach(c => root.classList.add(c));
        if (m.tunnel) document.body.setAttribute('data-tunnel', m.tunnel);
        window.jrBoot({ root, partial: 'partials/' + name + '.html', scripts: m.scripts || m });
      });
    };
    go();
  }
}
</script>
</body>
</html>
