<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow" />
<title>Page introuvable — RénoFacile</title>
<style>
  :root{--teal-700:#0F766E;--teal-800:#115E59;--slate-500:#64748B;--slate-600:#475569;--slate-900:#0F172A;--bg:#F8FAFC;--border:#E2E8F0;--font-sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--bg);color:var(--slate-900);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  a{color:var(--teal-700)}
  a:hover{color:var(--teal-800)}
  .card{max-width:520px;width:100%;background:#fff;border:1px solid var(--border);border-radius:16px;padding:40px 36px;text-align:center}
  .code{font:600 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--slate-500);margin-bottom:14px}
  h1{font-size:26px;letter-spacing:-.02em;margin:0 0 12px}
  p{color:var(--slate-600);font-size:15.5px;line-height:1.6;margin:0 0 26px;text-wrap:pretty}
  .cta{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;background:var(--teal-700);color:#fff;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none}
  .cta:hover{background:var(--teal-800);color:#fff}
  .alt{display:block;margin-top:16px;font-size:13.5px;color:var(--slate-500)}
</style>
</head>
<body>
<div class="card">
  <div class="code">Erreur 404</div>
  <h1>Cette page n'existe pas.</h1>
  <p>Le lien que vous avez suivi est peut-être obsolète, ou l'adresse comporte une erreur de frappe.</p>
  <a href="index.html" class="cta">Retour à l'accueil</a>
  <span class="alt">Besoin d'aide&nbsp;? <a href="mailto:hello@renofacile.fr">hello@renofacile.fr</a></span>
</div>
</body>
</html>
