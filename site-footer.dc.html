<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/junglerenov-design-system-fc00822c-9a4f-4aa5-96e5-e2f9567f58f8/styles.css">
  <script src="_ds/junglerenov-design-system-fc00822c-9a4f-4aa5-96e5-e2f9567f58f8/_ds_bundle.js"></script>
  <script src="lib/jr-logo.js"></script>
  <link rel="icon" type="image/svg+xml" href="assets/favicon-couleur-32.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-couleur-180.svg">
</helmet>
<div ref="{{ rootRef }}" style="background: var(--ink);">
  <x-import component-from-global-scope="JungleRenovDesignSystem_fc0082.SiteFooter" links="{{ links }}" hint-size="100%,240px"></x-import>
  <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
    <div style="max-width: var(--content-max); margin: 0 auto; padding: 0 var(--space-5) var(--space-6); box-sizing: border-box;">
      <p style="margin: 0; padding-top: var(--space-4); border-top: 1px solid var(--action); font: var(--type-caption); color: var(--paper);">© 2026 JungleRenov · Site édité par Norakt</p>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;360px&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  componentDidMount() {
    const lg = () => { if (!window.jrColorLogo || !this.rootRef.current) return setTimeout(lg, 50); window.jrColorLogo(this.rootRef.current, { selector: 'footer span[style*="line-height"]', tone: 'inverse', symbol: 32 }); };
    lg();
  }
  renderVals() {
    const compact = !!this.props.compact;
    const L = (label, href) => ({ label, href });
    const links = compact ? [
      L('Mentions légales', 'page-info.dc.html?p=mentions'), L('Confidentialité', 'page-info.dc.html?p=privacy'), L('Contact', 'page-info.dc.html?p=contact'),
    ] : [
      L('Simulation', 'choix-parcours.dc.html'), L('Aides et subventions', 'glossaire-aides.dc.html'), L('Annuaire artisans', 'annuaire-artisans.dc.html'),
      L('Guide MaPrimeRénov’', 'page-info.dc.html?p=guide-mpr'), L('Guide CEE', 'page-info.dc.html?p=guide-cee'), L('Calendrier DPE F et G', 'page-info.dc.html?p=guide-dpe'),
      L('À propos', 'page-info.dc.html?p=about'), L('Notre indépendance', 'page-info.dc.html?p=independance'), L('Notre modèle', 'index.dc.html#modele'), L('Presse', 'page-info.dc.html?p=presse'), L('Contact', 'page-info.dc.html?p=contact'),
      L('Mentions légales', 'page-info.dc.html?p=mentions'), L('CGU', 'page-info.dc.html?p=cgu'), L('Politique de confidentialité', 'page-info.dc.html?p=privacy'), L('Cookies', 'page-info.dc.html?p=cookies'),
    ];
    return { rootRef: this.rootRef, links, full: !compact };
  }
}
</script>
</body>
</html>
