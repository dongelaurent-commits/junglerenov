<body>
<x-dc>
<helmet>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;public&quot;,&quot;tunnel&quot;,&quot;espace&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;public&quot;,&quot;tsType&quot;:&quot;'public'|'tunnel'|'espace'|'admin'&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">

  state = { ds: !!window.JungleRenovDesignSystem_fc0082, user: null, w: window.innerWidth };
  rootRef = React.createRef();
  componentDidMount() {

    this.readUser();
    const lg = () => { if (!window.jrColorLogo || !this.rootRef.current) return setTimeout(lg, 50); window.jrColorLogo(this.rootRef.current, { selector: 'header a[aria-label] > span', tone: 'inverse', symbol: () => (this.rootRef.current && this.rootRef.current.offsetWidth < 960 ? 28 : 32), height: (s) => s }); };

    const bg = () => {
      const r = this.rootRef.current; if (!r) return setTimeout(bg, 60);
      const IV = '#F4F1E8', PO = '#8FD14F', LINE = '#34554A';
      const fix = () => {
        r.querySelectorAll('header nav a').forEach(a => {
          a.style.color = a.__jrHover ? PO : IV; a.style.fontSize = '17px'; a.style.whiteSpace = 'nowrap'; a.style.flexShrink = '0';
          const row = a.closest('nav').style.flexDirection !== 'column'; if (row) a.style.padding = r.offsetWidth < 960 ? '0 4px' : r.offsetWidth < 1040 ? '0 8px' : '0 12px';
          if (a.closest('nav').style.flexDirection === 'column') a.style.borderTopColor = LINE;
          if (!a.__jrH) { a.__jrH = true; a.addEventListener('mouseenter', () => { a.__jrHover = true; a.style.color = PO; }); a.addEventListener('mouseleave', () => { a.__jrHover = false; a.style.color = IV; }); }
        });
        const b = r.querySelector('header button[aria-expanded]'); if (!b) return;
        if (!b.__jrSO) { b.__jrSO = new MutationObserver(() => { if (b.style.background !== 'transparent') b.style.background = 'transparent'; if (b.style.color !== 'rgb(244, 241, 232)') b.style.color = IV; }); b.__jrSO.observe(b, { attributes: true, attributeFilter: ['style'] }); }

        if (b.__jrBurger === key && b.querySelector('[data-jr-burger]') && ![...b.children].some(c => !c.hasAttribute('data-jr-burger') && c.style.display !== 'none')) return; b.__jrBurger = key;
        b.setAttribute('aria-label', open ? 'Fermer le menu' : 'Menu');
        Object.assign(b.style, { width: '48px', height: '48px', minHeight: '48px', padding: '0', background: 'transparent', color: IV, border: '0', justifyContent: 'center' });
        const d = open ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16';
        [...b.children].forEach(c => { if (!c.hasAttribute('data-jr-burger')) c.style.display = 'none'; });
        let s = b.querySelector('[data-jr-burger]');
        if (!s) { s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('data-jr-burger', ''); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', '28'); s.setAttribute('height', '28'); s.setAttribute('aria-hidden', 'true'); s.innerHTML = '<path fill="none" stroke="#F4F1E8" stroke-width="1.5" stroke-linecap="round"/>'; b.appendChild(s); }

      };
      fix(); new MutationObserver(fix).observe(r, { childList: true, subtree: true, attributes: true, attributeFilter: ['aria-expanded'] });

    bg();
    if (!this.state.ds) this.t = setInterval(() => { if (window.JungleRenovDesignSystem_fc0082) { clearInterval(this.t); this.setState({ ds: true }); } }, 50);

  componentWillUnmount() { clearInterval(this.t); window.removeEventListener('resize', this.onW); }

      const s = JSON.parse(localStorage.getItem('junglerenov.session') || 'null');

    const home = u ? (u.role === 'super_admin' ? 'super-admin.dc.html' : u.role === 'admin' ? 'admin.dc.html' : 'dashboard.dc.html') : 'login.dc.html';
